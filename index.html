<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天使エルSDＡＲ</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            user-select: none;
        }
        model-viewer { 
            width: 100vw; 
            height: 100vh; 
            background-color: #f0f0f0; 
        }

        #ar-button {
            position: absolute; 
            top: 20px;          
            left: 20px;         
            padding: 14px 28px; 
            background-color: #fff; 
            border-radius: 25px;
            border: 2px solid #ccc; 
            font-weight: bold; 
            font-size: 16px;
            z-index: 999;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #model-select-container {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 999;
        }

        #model-select {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 20px;
            background-color: #fff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            outline: none;
        }

        /* --- Xアプリ（インアプリブラウザ）用案内モーダル --- */
        #inapp-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            z-index: 10000;
            box-sizing: border-box;
            padding: 30px 20px;
            text-align: center;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: #222;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffcc00;
        }

        .modal-desc {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ddd;
        }

        .browser-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #1da1f2;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<!-- インアプリブラウザ検知時のオーバーレイ案内 -->
<div id="inapp-modal">
    <div class="modal-content">
        <div class="modal-title">⚠️ Safari / Chromeで開いてください</div>
        <div class="modal-desc">
            X（Twitter）アプリ内ではAR機能が制限されています。<br><br>
            右上の<b>「...」</b>または<b>共有アイコン</b>をタップし、<br>
            <b>「ブラウザで開く」</b>を選択してください。
        </div>
        <a id="open-browser-link" href="#" class="browser-btn">ブラウザで開く</a>
    </div>
</div>

<model-viewer
    id="character-viewer"
    src="./eru_01.glb"
    ios-src="./eru_01.usdz" 
    alt="SD天使エル"
    ar
    ar-modes="scene-viewer quick-look" 
    camera-controls
    autoplay
    tone-mapping="none"
    exposure="1.5"
    shadow-intensity="1"
    field-of-view="40deg"
    max-camera-orbit="auto auto 200%"
>
    <button slot="ar-button" id="ar-button">AR撮影</button>
</model-viewer>

<div id="model-select-container">
    <select id="model-select">
        <option value="0">立ち</option>
        <option value="1">ババン</option>
        <option value="2">抱っこ</option>
        <option value="3">お座り</option>
        <option value="4">すやすや</option>
        <option value="5">ダンス</option>
    </select>
</div>

<script>
    // --- X（Twitter）アプリ等のインアプリブラウザ判定および誘導処理 ---
    (function checkInAppBrowser() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        // X(Twitter)アプリ、LINE、InstagramなどのWebviewキーワードを検知
        const isInApp = /Twitter|TwitterAndroid|FBAN|FBAV|Instagram|Line/i.test(ua);

        if (isInApp) {
            const isAndroid = /Android/i.test(ua);
            const currentUrl = window.location.href;

            if (isAndroid) {
                // Androidの場合: intentスキームを使ってChromeを強制起動を試みる
                const cleanUrl = currentUrl.replace(/^https?:\/\//, '');
                window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
            } else {
                // iOSの場合: 自動脱出が仕様上不可のためモーダルを表示
                document.addEventListener("DOMContentLoaded", () => {
                    const modal = document.getElementById('inapp-modal');
                    const link = document.getElementById('open-browser-link');
                    if (modal && link) {
                        link.href = currentUrl;
                        modal.style.display = 'block';
                    }
                });
            }
        }
    })();

    // --- 既存のモデル表示・変更スクリプト ---
    const viewer = document.querySelector('#character-viewer');
    const modelSelect = document.querySelector('#model-select');
    let currentSelectedIndex = 0;
    let isPreloaded = false;

    const modelData = [
        { name: "立ち", glb: "./eru_01.glb", usdz: "./eru_01.usdz" },
        { name: "ババン", glb: "./eru_02.glb", usdz: "./eru_02.usdz" },
        { name: "抱っこ", glb: "./eru_03.glb", usdz: "./eru_03.usdz" },
        { name: "お座り", glb: "./eru_04.glb", usdz: "./eru_04.usdz" },
        { name: "すやすや", glb: "./eru_05.glb", usdz: "./eru_05.usdz" },
        { name: "ダンス", glb: "./eru_06.glb", usdz: "./eru_06.usdz" }
    ];

    function changeModel(index) {
        currentSelectedIndex = index; 
        const model = modelData[index];
        viewer.src = model.glb;
        viewer.iosSrc = model.usdz;
        
        adjustCamera();
    }

    function adjustCamera() {
        if (currentSelectedIndex === 2) {
            viewer.cameraTarget = "0m 0.2m 0m";
            viewer.cameraOrbit = "0deg 85deg 140%";
        } else if (currentSelectedIndex === 3) {
            viewer.cameraTarget = "0m 0.15m 0m";
            viewer.cameraOrbit = "0deg 85deg 135%";
        } else if (currentSelectedIndex === 5) {
            viewer.cameraTarget = "0m 0.15m 0m";
            viewer.cameraOrbit = "0deg 85deg 170%";
        } else {
            viewer.cameraTarget = "0m 0.25m 0m";
            viewer.cameraOrbit = "0deg 85deg 150%";
        }
    }

    viewer.addEventListener('load', () => {
        const available = viewer.availableAnimations;
        if (available.length > 0) {
            viewer.animationName = available[0];
            viewer.play();
        }

        if (!isPreloaded) {
            isPreloaded = true;
            setTimeout(() => {
                modelData.forEach((model, index) => {
                    if (index > 0) {
                        fetch(model.glb).catch(() => {});
                    }
                });
            }, 2000);
        }
    });

    modelSelect.addEventListener('change', (event) => {
        const index = parseInt(event.target.value, 10);
        changeModel(index);
    });

    adjustCamera();
</script>

</body>
</html>
